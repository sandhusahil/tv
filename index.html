<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Links</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --background: #f5f7fb;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #111827;
      --hover: #f3f4f6;
    }

    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Arial, sans-serif;
      background: var(--background);
      color: var(--text);
      min-height: 100vh;
    }

    .container {
      width: min(100% - 32px, 900px);
      margin: 0 auto;
      padding: 60px 0 40px;
    }

    /* Header */
    .profile {
      text-align: center;
      margin-bottom: 40px;
    }

    .avatar {
      width: 82px;
      height: 82px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: #111827;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -1px;
    }

    .profile h1 {
      font-size: clamp(28px, 5vw, 40px);
      font-weight: 750;
      letter-spacing: -1.5px;
      margin-bottom: 8px;
    }

    .profile p {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
    }

    /* Links */
    .links {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .link-card {
      position: relative;
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      min-height: 78px;
      padding: 16px 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      text-decoration: none;
      color: var(--text);
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        border-color 0.2s ease;
    }

    .link-card:hover {
      transform: translateY(-2px);
      border-color: #d1d5db;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.07);
    }

    .link-card:active {
      transform: scale(0.99);
    }

    .icon {
      width: 46px;
      height: 46px;
      flex-shrink: 0;
      border-radius: 13px;
      background: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
    }

    .link-content {
      flex: 1;
      min-width: 0;
    }

    .link-title {
      display: block;
      font-size: 17px;
      font-weight: 650;
      margin-bottom: 4px;
    }

    .link-description {
      display: block;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.4;
    }

    .arrow {
      font-size: 22px;
      color: #9ca3af;
      transition: transform 0.2s ease;
    }

    .link-card:hover .arrow {
      transform: translateX(4px);
      color: var(--text);
    }

    /* Footer */
    footer {
      text-align: center;
      margin-top: 42px;
      color: #9ca3af;
      font-size: 13px;
    }

    /* Tablet / Desktop */
    @media (min-width: 650px) {
      .container {
        padding-top: 80px;
      }

      .links {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* Small phones */
    @media (max-width: 380px) {
      .container {
        width: min(100% - 22px, 900px);
        padding-top: 40px;
      }

      .link-card {
        padding: 14px;
      }

      .link-description {
        font-size: 13px;
      }
    }

    /* Accessibility */
    @media (prefers-reduced-motion: reduce) {
      * {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  </main>
