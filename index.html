
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Movies</title>
  <meta name="description" content="Explore">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='25' fill='%23111827'/%3E%3Ctext x='50' y='65' font-size='43' font-family='Arial' font-weight='bold' text-anchor='middle' fill='white'%3ESS%3C/text%3E%3C/svg%3E">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont,
        "Segoe UI", Roboto, Arial, sans-serif;
      background: #f8f9fb;
      color: #111827;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 70px 20px 30px;
    }

    .container {
      width: 100%;
      max-width: 650px;
    }

    /* Profile */

    .profile {
      text-align: center;
      margin-bottom: 38px;
    }

    .avatar {
      width: 72px;
      height: 72px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: #111827;
      color: white;
      display: grid;
      place-items: center;
      font-size: 23px;
      font-weight: 700;
    }

    h1 {
      font-size: clamp(25px, 5vw, 34px);
      letter-spacing: -1px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #6b7280;
      font-size: 15px;
      line-height: 1.6;
    }

    /* Links */

    .links {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .link-card {
      min-width: 0;
      min-height: 88px;
      padding: 17px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      text-decoration: none;
      color: #111827;
      transition: border-color 0.2s, transform 0.2s;
    }

    .link-card:hover {
      border-color: #9ca3af;
      transform: translateY(-2px);
    }

    .icon {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      border-radius: 11px;
      background: #f3f4f6;
      display: grid;
      place-items: center;
      font-size: 20px;
    }

    .link-content {
      min-width: 0;
      flex: 1;
    }

    .link-title {
      display: block;
      font-size: 15px;
      font-weight: 650;
      margin-bottom: 4px;
    }

    .link-description {
      display: block;
      color: #6b7280;
      font-size: 12px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .arrow {
      color: #9ca3af;
      font-size: 19px;
      flex-shrink: 0;
    }

    /* Footer */

    footer {
      margin-top: 35px;
      text-align: center;
      color: #9ca3af;
      font-size: 12px;
    }

    /* Mobile */

    @media (max-width: 480px) {
      body {
        padding: 45px 16px 25px;
      }

      .profile {
        margin-bottom: 30px;
      }

      .links {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .link-card {
        min-height: 76px;
        padding: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <header class="profile">
      <div class="avatar" aria-hidden="true">SS</div>
      <h1>Sahilpreet Singh Sandhu</h1>
      <p class="subtitle">Welcome to my links</p>
    </header>

    <section class="links" aria-label="My links">

      <a class="link-card"
         href="https://drive.google.com/file/d/1rLHjamfGCDkbaVcTOx5be3UkOaYA7YSJ/view?usp=sharing"
         target="_blank" rel="noopener noreferrer">

        <span class="icon" aria-hidden="true">🌐</span>
        <span class="link-content">
          <span class="link-title">ਬੋਲ ਭਾਵੇਂ ਨਾ ਬੋਲ (2026)</span>
          <span class="link-description">Click Here</span>
        </span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>

      <a class="link-card"
         href=""
         target="_blank" rel="noopener noreferrer">

        <span class="icon" aria-hidden="true">💼</span>
        <span class="link-content">
          <span class="link-title">Coming Soon</span>
          <span class="link-description">Click Here</span>
        </span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>

      <a class="link-card"
         href=""
         target="_blank" rel="noopener noreferrer">

        <span class="icon" aria-hidden="true">💻</span>
        <span class="link-content">
          <span class="link-title">Coming Soon</span>
          <span class="link-description">Click Here</span>
        </span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>

      <a class="link-card"
         href=""
         target="_blank" rel="noopener noreferrer">

        <span class="icon" aria-hidden="true">📄</span>
        <span class="link-content">
          <span class="link-title">Coming Soon</span>
          <span class="link-description">Click Here</span>
        </span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>

    </section>

    <footer>
      © 2026 Sahilpreet Singh Sandhu
    </footer>

  </main>

</body>
</html>
